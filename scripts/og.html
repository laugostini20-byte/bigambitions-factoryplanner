<!doctype html>
<!-- Social preview card. Render to og.png (1200x630):
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --screenshot="$PWD/og.png" "file://$PWD/scripts/og.html"
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #12181B;
    color: #E4EAEC;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px;
    box-sizing: border-box;
    background-image:
      linear-gradient(#1A2226 1px, transparent 1px),
      linear-gradient(90deg, #1A2226 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .top { display: flex; align-items: center; gap: 28px; }
  .mark { width: 120px; height: 120px; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 28px; color: #93A2A9; letter-spacing: 0.04em; }
  h1 { margin: 0; white-space: nowrap; font-size: 112px; line-height: 0.9; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; }
  h1 span { color: #E6A23C; }
  .sub { font-size: 44px; font-weight: 600; color: #E4EAEC; margin-top: 18px; }
  .stats { display: flex; gap: 16px; font-family: "IBM Plex Mono", monospace; font-size: 24px; }
  .stats div { white-space: nowrap; border: 2px solid #2D3A40; background: #1A2226; padding: 12px 20px; border-radius: 4px; }
  .stats b { color: #6BC291; font-weight: 500; }
</style>
</head>
<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#1A2227" stroke="#2D3A40"/><path d="M5 26V14l6 4v-4l6 4v-4l6 4V8h4v18z" fill="#E6A23C"/></svg>
    <div class="kicker">BIG AMBITIONS · FACTORY TOOL</div>
  </div>
  <div>
    <h1>Factory <span>Line</span> Planner</h1>
    <div class="sub">Make it or import it? Costs, savings and payback for every recipe.</div>
  </div>
  <div class="stats">
    <div><b>62</b> recipes</div>
    <div>raw material orders</div>
    <div>machine payback</div>
    <div>1.0 game data</div>
  </div>
</body>
</html>
